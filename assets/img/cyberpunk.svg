<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 500" role="img"
     aria-label="Portada de Cyberpunk 2077">
  <defs>
    <linearGradient id="g-cyberpunk" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#3b2f00"/>
      <stop offset="1" stop-color="#1a1500"/>
    </linearGradient>
  </defs>
  <rect width="400" height="500" fill="url(#g-cyberpunk)"/>
  <circle cx="330" cy="90" r="120" fill="#fcee0a" opacity="0.13"/>
  <circle cx="60" cy="430" r="90" fill="#fcee0a" opacity="0.10"/>
  <rect x="0" y="0" width="8" height="500" fill="#fcee0a"/>
  <g font-family="Segoe UI, Arial, sans-serif" text-anchor="middle">
    <text font-size="44" font-weight="700" fill="#ffffff">
      <tspan x="200" y="224">Cyberpunk</tspan>
      <tspan x="200" y="276">2077</tspan>
    </text>
    <text x="200" y="400" font-size="20" font-weight="600" fill="#fcee0a"
          letter-spacing="2">ACCIÓN</text>
    <text x="200" y="432" font-size="17" fill="#c9d1d9">PC</text>
  </g>
  <rect x="24" y="24" width="352" height="452" fill="none" stroke="#fcee0a"
        stroke-opacity="0.35" stroke-width="2" rx="6"/>
</svg>
